name: M03 quality and integration

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m03-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      CITY_DIAGNOSTICS_ENABLED: "true"
    steps:
      # Official release tags resolved to these commits on 2026-10-26.
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install Node.js 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.11.12"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked dependencies
        run: make setup

      - name: Lint and type check
        run: make lint

      - name: Unit and contract tests
        run: make test

      - name: Build production frontend
        run: make build

      - name: Native ARM64 Compose startup and end-to-end smoke
        run: make dev

      - name: Verify live database, spatial API and persistence integrity
        run: uv run --locked python scripts/database_checks.py

      - name: Inspect native spatial columns and actual indexed queries
        run: uv run --locked python scripts/inspect_geospatial_database.py --output docs/evidence/m03/postgis-inspection.json

      - name: Verify isolated fresh and rollback migrations
        run: uv run --locked python scripts/verify_migrations.py

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser smoke on desktop, tablet and mobile
        run: npm run test:browser

      - name: Observe actual 300-road display and lifecycle
        run: uv run --locked python scripts/verify_city_performance.py

      - name: Verify dependency failure and recovery
        run: uv run --locked python scripts/failure_smoke.py

      - name: Verify environment files stay outside Docker contexts
        run: uv run --locked python infra/verification/check_build_context.py

      - name: Verify migration is repeatable
        run: make migrate

      - name: Show native PostgreSQL and PostGIS versions
        run: docker compose exec -T db psql -U earthmind -d earthmind -c 'SELECT version(), PostGIS_Full_Version();'

      - name: Show service diagnostics on failure
        if: failure()
        run: |
          if [ -f .env ]; then
            docker compose ps --all
            docker compose logs --no-color --tail=100
          fi

      - name: Stop services
        if: always()
        run: |
          if [ -f .env ]; then
            make down
          fi
