name: earthmind

x-python: &python-service
  image: earthmind-python:m01
  platform: linux/arm64
  build:
    context: .
    dockerfile: infra/docker/python.Dockerfile
  init: true
  cpus: 0.5
  mem_limit: 512m
  pids_limit: 128
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true

x-app-environment: &app-environment
  DATABASE_URL: postgresql://${POSTGRES_USER:-earthmind}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-earthmind}
  REDIS_URL: redis://redis:6379/0
  CORS_ORIGINS: '["http://localhost:${WEB_PORT:-3000}","http://127.0.0.1:${WEB_PORT:-3000}"]'

services:
  db:
    image: earthmind-postgis:m01
    platform: linux/arm64
    cpus: 1.0
    mem_limit: 768m
    pids_limit: 128
    build:
      context: .
      dockerfile: infra/docker/postgis/Dockerfile
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-earthmind}
      POSTGRES_USER: ${POSTGRES_USER:-earthmind}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    ports:
      - "127.0.0.1:${DB_PORT:-5434}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\" && psql -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\" -tAc 'SELECT 1' >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: "on-failure:3"

  redis:
    image: redis:7.4-bookworm@sha256:44960b3100c48159a66d28c18b0588c193492e25f7551d60e51dd464fc3eca5b
    platform: linux/arm64
    cpus: 0.25
    mem_limit: 128m
    pids_limit: 64
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "96mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: "on-failure:3"

  migrate:
    <<: *python-service
    environment: *app-environment
    command: ["alembic", "-c", "apps/api/alembic.ini", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  worker:
    <<: *python-service
    image: earthmind-worker:m01
    build:
      context: .
      dockerfile: infra/docker/worker.Dockerfile
    cpus: 1.0
    mem_limit: 768m
    pids_limit: 128
    environment:
      REDIS_URL: redis://redis:6379/0
    command: ["python", "-m", "earthmind_worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "earthmind_worker.health"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: "on-failure:3"

  api:
    <<: *python-service
    environment:
      <<: *app-environment
      EARTHMIND_DEV_WRITE_TOKEN: ${EARTHMIND_DEV_WRITE_TOKEN:-}
      GEO_MAX_REQUEST_BYTES: ${GEO_MAX_REQUEST_BYTES:-262144}
      GEO_MAX_COORDINATES: ${GEO_MAX_COORDINATES:-5000}
      GEO_MAX_BBOX_DEGREES: ${GEO_MAX_BBOX_DEGREES:-1.0}
      GEO_MAX_PAGE_SIZE: ${GEO_MAX_PAGE_SIZE:-100}
      GEO_MAX_RADIUS_M: ${GEO_MAX_RADIUS_M:-5000}
      GEO_MAX_VALIDATION_FEATURES: ${GEO_MAX_VALIDATION_FEATURES:-10000}
      GEO_MAX_VALIDATION_COORDINATES: ${GEO_MAX_VALIDATION_COORDINATES:-100000}
      GEO_BOUNDARY_TOLERANCE_M: ${GEO_BOUNDARY_TOLERANCE_M:-5}
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      worker:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=5)"]
      interval: 5s
      timeout: 6s
      retries: 10
      start_period: 10s
    restart: "on-failure:3"

  web:
    image: earthmind-web:m01
    platform: linux/arm64
    cpus: 0.5
    mem_limit: 512m
    pids_limit: 128
    cap_drop: [ALL]
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
    environment:
      API_INTERNAL_URL: http://api:8000
      CITY_IMAGERY_MODE: ${CITY_IMAGERY_MODE:-local-osm}
      CESIUM_ION_PUBLIC_TOKEN: ${CESIUM_ION_PUBLIC_TOKEN:-}
      NEXT_PUBLIC_CESIUM_ION_TOKEN: ${NEXT_PUBLIC_CESIUM_ION_TOKEN:-}
      CESIUM_ION_IMAGERY_ASSET_ID: ${CESIUM_ION_IMAGERY_ASSET_ID:-2}
      CESIUM_ION_TERRAIN_ASSET_ID: ${CESIUM_ION_TERRAIN_ASSET_ID:-1}
      CITY_DIAGNOSTICS_ENABLED: ${CITY_DIAGNOSTICS_ENABLED:-false}
    volumes:
      - ./data/dubai-osm/recovery-v1/context:/app/apps/web/public/geography:ro
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health/live').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    init: true
    security_opt:
      - no-new-privileges:true
    restart: "on-failure:3"

volumes:
  postgres_data:
  redis_data:
