repos:
  - repo: local
    hooks:
      - id: contracts
        name: Generated service contracts
        entry: uv run --locked python packages/contracts/generate_types.py --check
        language: system
        pass_filenames: false
        files: ^packages/contracts/
      - id: ruff
        name: Ruff lint
        entry: uv run --locked ruff check
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: Ruff format
        entry: uv run --locked ruff format --check
        language: system
        types_or: [python, pyi]
      - id: mypy
        name: Python type check
        entry: uv run --locked mypy
        language: system
        pass_filenames: false
        types_or: [python, pyi]
      - id: eslint
        name: ESLint
        entry: npm run lint
        language: system
        pass_filenames: false
        files: ^(apps/web/|packages/contracts/|package.*json)
      - id: typescript
        name: TypeScript check
        entry: npm run typecheck
        language: system
        pass_filenames: false
        files: ^(apps/web/|packages/contracts/|package.*json)
