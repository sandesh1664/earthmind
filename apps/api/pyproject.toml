[project]
name = "earthmind-api"
version = "0.1.0"
description = "EARTHMIND infrastructure API"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.17,<2",
  "earthmind-contracts",
  "fastapi>=0.120,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.11,<3",
  "redis>=6.4,<7",
  "sqlalchemy[asyncio]>=2.0,<3",
  "uvicorn[standard]>=0.38,<1",
]

[build-system]
requires = ["uv_build==0.11.12"]
build-backend = "uv_build"

[tool.uv.sources]
earthmind-contracts = { workspace = true }
